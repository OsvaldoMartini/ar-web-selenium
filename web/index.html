<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Web Bot HTTP Server</title>
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f7f6; color: #333; }
        .container { background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; border: 1px solid #e0e0e0;}
        h1 { color: #2c3e50; margin-bottom: 20px; font-size: 2.2em; }
        p { color: #7f8c8d; font-size: 1.1em; line-height: 1.6; }
        .port-info { margin-top: 25px; padding: 15px; background-color: #ecf0f1; border-radius: 8px; border: 1px solid #bdc3c7; display: inline-block; }
        .port-info strong { color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to AR Web Bot HTTP Server!</h1>
        <p>This page is served statically from the <code>/web</code> directory.</p>
        <p>Your WebSocket server is also running on a separate port, ready for connections.</p>
        <div class="port-info">
            <p>HTTP Server running on: <strong>http://localhost:8080</strong></p>
            <p>WebSocket Server running on: <strong>ws://localhost:[WebSocketPort]/websocket</strong></p>
        </div>
    </div>
</body>
</html>
