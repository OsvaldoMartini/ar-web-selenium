<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React TypeScript Grid</title>

    <script src="./react.development.js" crossorigin></script>
    <script src="./react-dom.development.js" crossorigin></script>
    <script src="./babel.min.js"></script>

    <!-- CSS for the simple grid -->
    <style>
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
      }

      #root {
        width: 100%;
        max-width: 1200px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }

      .grid-item {
        background-color: #e0f7fa;
        padding: 20px;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
        border-radius: 4px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Load the external React app code -->
    <script
      type="text/babel"
      src="./src/components/GridItem.jsx"
      data-type="module"
      data-presets="react,typescript"
    ></script>
  </body>
</html>
