<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Simple template</title>
    <!-- Load the JS file -->
    <script src="core.js"></script>

  <body>
    <script>
      // Wait until WASM is loaded
      setTimeout(() => {
